<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Alex Loves Mariam</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;

      background:
        radial-gradient(circle at center, #243b6b 0%, #111827 55%, #080d18 100%);

      color: white;
      overflow-x: hidden;
    }


    /* =========================================================
       FULL-SCREEN ROMANTIC BACKGROUND
       ========================================================= */

    body::before {
      content:
        "Alex and Mariam Sitting in a Tree     Alex × Mariam     Alex and Mariam Sitting in a Tree     Alex × Mariam     Alex and Mariam Sitting in a Tree     Alex × Mariam     Alex and Mariam Sitting in a Tree     Alex × Mariam";

      position: fixed;

      top: -20%;
      left: -20%;

      width: 140%;
      height: 140%;

      z-index: -2;

      font-size: 38px;
      font-weight: 900;
      line-height: 3;

      letter-spacing: 3px;

      color: rgba(255, 255, 255, 0.075);

      transform: rotate(-15deg);

      white-space: pre-wrap;

      pointer-events: none;
    }


    /* Additional background layer */

    body::after {
      content:
        "ALEX ♥ MARIAM     ALEX ♥ MARIAM     ALEX ♥ MARIAM     ALEX ♥ MARIAM     ALEX ♥ MARIAM     ALEX ♥ MARIAM     ALEX ♥ MARIAM";

      position: fixed;

      top: -10%;
      left: -20%;

      width: 140%;
      height: 140%;

      z-index: -1;

      font-size: 22px;
      font-weight: bold;

      line-height: 5;

      letter-spacing: 6px;

      color: rgba(250, 204, 21, 0.055);

      transform: rotate(15deg);

      white-space: pre-wrap;

      pointer-events: none;
    }


    /* =========================================================
       MAIN CONTENT
       ========================================================= */

    main {
      min-height: 100vh;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      padding: 30px 20px 50px;

      position: relative;
    }


    /* =========================================================
       TITLE
       ========================================================= */

    h1 {
      margin: 0 0 8px;

      font-size: clamp(32px, 5vw, 58px);

      font-weight: 900;

      letter-spacing: 1px;

      text-shadow:
        0 4px 15px rgba(0, 0, 0, 0.45);
    }


    .subtitle {
      margin-bottom: 28px;

      font-size: clamp(18px, 2.5vw, 26px);

      font-weight: bold;

      color: #facc15;

      text-shadow:
        0 3px 10px rgba(0, 0, 0, 0.5);
    }


    /* =========================================================
       WHEEL
       ========================================================= */

    .wheel-wrapper {
      position: relative;

      /*
        MUCH BIGGER WHEEL
      */

      width: min(760px, 92vw);

      aspect-ratio: 1 / 1;

      display: flex;
      align-items: center;
      justify-content: center;

      filter:
        drop-shadow(0 18px 30px rgba(0, 0, 0, 0.45));
    }


    canvas {
      width: 100%;
      height: 100%;

      display: block;

      transition:
        transform 8s cubic-bezier(0.12, 0.75, 0.15, 1);

      border-radius: 50%;
    }


    /* =========================================================
       POINTER
       ========================================================= */

    .pointer {
      position: absolute;

      top: -3px;

      left: 50%;

      transform: translateX(-50%);

      width: 0;
      height: 0;

      border-left: 27px solid transparent;
      border-right: 27px solid transparent;

      border-top: 58px solid #facc15;

      z-index: 5;

      filter:
        drop-shadow(0 4px 4px rgba(0, 0, 0, 0.45));
    }


    /* =========================================================
       SPIN BUTTON
       ========================================================= */

    button {
      margin-top: 38px;

      padding: 17px 52px;

      font-size: 25px;

      font-weight: 900;

      border: none;

      border-radius: 999px;

      cursor: pointer;

      background: #22c55e;

      color: #052e16;

      box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.35);

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
    }


    button:hover:not(:disabled) {
      transform: translateY(-2px) scale(1.03);

      box-shadow:
        0 12px 25px rgba(0, 0, 0, 0.4);
    }


    button:active:not(:disabled) {
      transform: scale(0.97);
    }


    button:disabled {
      opacity: 0.6;

      cursor: not-allowed;
    }


    /* =========================================================
       RESULT
       ========================================================= */

    #result {
      margin-top: 28px;

      padding: 14px 25px;

      font-size: clamp(22px, 3vw, 32px);

      font-weight: 900;

      max-width: 850px;

      line-height: 1.3;

      text-shadow:
        0 3px 10px rgba(0, 0, 0, 0.5);

      min-height: 42px;
    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 600px) {

      main {
        padding-top: 25px;
      }

      .subtitle {
        margin-bottom: 20px;
      }

      .wheel-wrapper {
        width: 96vw;
      }

      .pointer {
        border-left-width: 20px;
        border-right-width: 20px;
        border-top-width: 45px;
      }

      button {
        margin-top: 25px;

        padding: 14px 40px;

        font-size: 22px;
      }

      #result {
        font-size: 22px;
      }
    }
  </style>
</head>


<body>

  <main>

    <h1>Alex &amp; Mariam</h1>

    <div class="subtitle">
      Alex and Mariam Sitting in a Tree ❤️
    </div>


    <div class="wheel-wrapper">

      <div class="pointer"></div>

      <canvas
        id="wheel"
        width="760"
        height="760">
      </canvas>

    </div>


    <button id="spinBtn">
      SPIN ❤️
    </button>


    <div id="result">
      Click spin to begin
    </div>

  </main>


  <script>

    /* =========================================================
       WHEEL ITEMS
       ========================================================= */

    const items = [
      "Screen Time Tribute",
      "Movie or TV Marathon",
      "Favourite Food Delivery",
      "Premium Scratches Session",
      "Short Story of Our Love Story - New Theme Each Time",
      "TV Show Edit",
      "No-Complaints Errand Run",
      "Apology Letter",
      "Spa Night at Air B&B",
      "Snack Basket Offering",
      "Pop Playlist for Us",
      "Memory Lane Slideshow",
      "Next Car Maintenance",
      "Cozy Blanket Fort Night",
      "Handmade Coupon of Her Choice",
      "Plan the Next Cute Outing",
      "Other of Your Choosing",
      "New Innovative Idea",
      "Full Day Princess Treatment",
      "Cook Egyptian Meal of Your Choosing with Tea",
      "Find New TV Show for Us",
      "Drives To and From Work for a Week",
      "Drive Home, Even from Toronto, at Any Time of Your Choosing",
      "Buy New Article of Clothing of Your Choosing",
      "Buy New Perfume of Your Choosing"
    ];


    /* =========================================================
       CANVAS SETUP
       ========================================================= */

    const canvas =
      document.getElementById("wheel");

    const ctx =
      canvas.getContext("2d");

    const spinBtn =
      document.getElementById("spinBtn");

    const result =
      document.getElementById("result");


    const size = canvas.width;

    const center = size / 2;

    const radius = center - 12;

    const sliceAngle =
      (2 * Math.PI) / items.length;


    let currentRotation = 0;

    let spinning = false;


    /* =========================================================
       TEXT WRAPPING
       ========================================================= */

    function drawWrappedText(
      text,
      x,
      y,
      maxWidth,
      lineHeight
    ) {

      const words = text.split(" ");

      let lines = [];

      let currentLine = "";


      for (let word of words) {

        const testLine =
          currentLine
            ? currentLine + " " + word
            : word;

        const width =
          ctx.measureText(testLine).width;


        if (
          width > maxWidth &&
          currentLine
        ) {

          lines.push(currentLine);

          currentLine = word;

        } else {

          currentLine = testLine;

        }

      }


      if (currentLine) {
        lines.push(currentLine);
      }


      const totalHeight =
        lines.length * lineHeight;


      lines.forEach((line, index) => {

        ctx.fillText(
          line,
          x,
          y -
            totalHeight / 2 +
            index * lineHeight +
            lineHeight / 2
        );

      });

    }


    /* =========================================================
       DRAW WHEEL
       ========================================================= */

    function drawWheel() {

      ctx.clearRect(
        0,
        0,
        size,
        size
      );


      for (
        let i = 0;
        i < items.length;
        i++
      ) {

        const startAngle =
          i * sliceAngle;

        const endAngle =
          startAngle + sliceAngle;


        /* ---------------------------------------------
           SLICE
           --------------------------------------------- */

        ctx.beginPath();

        ctx.moveTo(
          center,
          center
        );

        ctx.arc(
          center,
          center,
          radius,
          startAngle,
          endAngle
        );

        ctx.closePath();


        /*
          Alternating colours
        */

        ctx.fillStyle =
          i % 2 === 0
            ? "#3b82f6"
            : "#ef4444";

        ctx.fill();


        /*
          Slice borders
        */

        ctx.strokeStyle =
          "rgba(255,255,255,0.9)";

        ctx.lineWidth = 2;

        ctx.stroke();


        /* ---------------------------------------------
           TEXT
           --------------------------------------------- */

        ctx.save();

        ctx.translate(
          center,
          center
        );


        const textAngle =
          startAngle +
          sliceAngle / 2;


        ctx.rotate(textAngle);


        /*
          IMPORTANT:

          Larger, easier-to-read text.
        */

        ctx.font =
          "900 16px Arial";


        ctx.fillStyle =
          "#ffffff";


        ctx.textAlign =
          "right";

        ctx.textBaseline =
          "middle";


        /*
          Give each phrase more room.
        */

        drawWrappedText(
          items[i],
          center - 38,
          0,
          235,
          18
        );


        ctx.restore();

      }


      /* =====================================================
         OUTER RING
         ===================================================== */

      ctx.beginPath();

      ctx.arc(
        center,
        center,
        radius,
        0,
        Math.PI * 2
      );

      ctx.strokeStyle =
        "#ffffff";

      ctx.lineWidth = 7;

      ctx.stroke();


      /* =====================================================
         CENTRE CIRCLE
         ===================================================== */

      ctx.beginPath();

      ctx.arc(
        center,
        center,
        62,
        0,
        Math.PI * 2
      );

      ctx.fillStyle =
        "#111827";

      ctx.fill();


      ctx.strokeStyle =
        "#facc15";

      ctx.lineWidth = 5;

      ctx.stroke();


      /* =====================================================
         CENTRE HEART
         ===================================================== */

      ctx.fillStyle =
        "#ffffff";

      ctx.font =
        "900 27px Arial";

      ctx.textAlign =
        "center";

      ctx.textBaseline =
        "middle";


      ctx.fillText(
        "❤️",
        center,
        center
      );

    }


    /* =========================================================
       SPIN
       ========================================================= */

    function spinWheel() {

      if (spinning) return;


      spinning = true;

      spinBtn.disabled = true;

      result.textContent =
        "Spinning...";


      /* ---------------------------------------------
         RANDOM WINNER
         --------------------------------------------- */

      const randomIndex =
        Math.floor(
          Math.random() *
          items.length
        );


      const degreesPerSlice =
        360 / items.length;


      /* ---------------------------------------------
         POSITION WINNING SLICE
         --------------------------------------------- */

      const winningAngle =
        270 -
        randomIndex *
          degreesPerSlice -
        degreesPerSlice / 2;


      /*
        12 complete rotations
        before landing on the winner.
      */

      const extraSpins =
        12 * 360;


      const finalRotation =
        currentRotation +
        extraSpins +
        winningAngle;


      canvas.style.transform =
        `rotate(${finalRotation}deg)`;


      currentRotation =
        finalRotation % 360;


      /* ---------------------------------------------
         FINISH
         --------------------------------------------- */

      setTimeout(() => {

        result.textContent =
          `❤️ Result: ${items[randomIndex]}`;


        spinBtn.disabled =
          false;


        spinning =
          false;

      }, 8000);

    }


    /* =========================================================
       START
       ========================================================= */

    drawWheel();


    spinBtn.addEventListener(
      "click",
      spinWheel
    );

  </script>

</body>
</html>
