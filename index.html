<body>

  <main>

    <h1>Spin the Wheel</h1>

    <div class="wheel-wrapper">
      <div class="pointer"></div>
      <canvas id="wheel" width="500" height="500"></canvas>
    </div>

    <button id="spinBtn">Spin</button>

    <div id="result">Click spin to begin</div>

  </main>


  <script>

    const items = [
      "Screen Time Tribute",
      "Movie or TV Marathon",
      "Favourite Food Delivery",
      "Premium Scratches Session",
      "Short Story of Our Love Story - New Theme Each Time",
      "TV Show Edit",
      "No-Complaints Errand Run",
      "Apology Letter",
      "Spa Night at Air B&B",
      "Snack Basket Offering",
      "Pop Playlist for Us",
      "Memory Lane Slideshow",
      "Next Car Maintenance",
      "Cozy Blanket Fort Night",
      "Handmade Coupon of Her Choice",
      "Plan the Next Cute Outing",
      "Other of Your Choosing",
      "New Innovative Idea",
      "Full Day Princess Treatment",
      "Cook Egyptian Meal of Your Choosing with Tea",
      "Find New TV Show for Us",
      "Drives To and From Work for a Week",
      "Drive Home, Even from Toronto, at Any Time of Your Choosing",
      "Buy New Article of Clothing of Your Choosing",
      "Buy New Perfume of Your Choosing"
    ];


    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");

    const spinBtn = document.getElementById("spinBtn");
    const result = document.getElementById("result");

    const size = canvas.width;
    const center = size / 2;

    const sliceAngle = (2 * Math.PI) / items.length;

    let currentRotation = 0;
    let spinning = false;


    function drawWheel() {

      ctx.clearRect(0, 0, size, size);

      for (let i = 0; i < items.length; i++) {

        const startAngle = i * sliceAngle;
        const endAngle = startAngle + sliceAngle;

        /* Wheel slice */

        ctx.beginPath();

        ctx.moveTo(center, center);

        ctx.arc(
          center,
          center,
          center - 10,
          startAngle,
          endAngle
        );

        ctx.closePath();

        ctx.fillStyle =
          i % 2 === 0
            ? "#3b82f6"
            : "#ef4444";

        ctx.fill();

        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.stroke();


        /* Text */

        ctx.save();

        ctx.translate(center, center);

        /*
          Put the text along the same radial direction
          as the wheel slices.
        */

        const textAngle =
          startAngle + sliceAngle / 2;

        ctx.rotate(textAngle);

        ctx.textAlign = "right";
        ctx.textBaseline = "middle";

        ctx.fillStyle = "white";

        /*
          Slightly smaller font so longer phrases
          fit better around the wheel.
        */

        ctx.font = "bold 10px Arial";

        /*
          The text now follows the radial direction
          of the wheel instead of being horizontal.
        */

        ctx.fillText(
          items[i],
          center - 28,
          0
        );

        ctx.restore();
      }


      /* Centre circle */

      ctx.beginPath();

      ctx.arc(
        center,
        center,
        45,
        0,
        Math.PI * 2
      );

      ctx.fillStyle = "#111827";

      ctx.fill();


      /* SPIN text */

      ctx.fillStyle = "white";

      ctx.font = "bold 18px Arial";

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      ctx.fillText(
        "SPIN",
        center,
        center
      );
    }


    function spinWheel() {

      if (spinning) return;

      spinning = true;

      spinBtn.disabled = true;

      result.textContent = "Spinning...";


      /* Pick winner */

      const randomIndex =
        Math.floor(
          Math.random() * items.length
        );


      const degreesPerSlice =
        360 / items.length;


      /*
        Calculate where the winning slice needs
        to land underneath the arrow.
      */

      const winningAngle =
        270 -
        randomIndex * degreesPerSlice -
        degreesPerSlice / 2;


      /*
        MUCH longer spin.

        Previously:
        5 rotations

        Now:
        12 rotations
      */

      const extraSpins = 12 * 360;


      const finalRotation =
        currentRotation +
        extraSpins +
        winningAngle;


      canvas.style.transform =
        `rotate(${finalRotation}deg)`;


      currentRotation =
        finalRotation % 360;


      /*
        This must match the CSS animation duration.
      */

      setTimeout(() => {

        result.textContent =
          `Result: ${items[randomIndex]}`;

        spinBtn.disabled = false;

        spinning = false;

      }, 8000);

    }


    drawWheel();

    spinBtn.addEventListener(
      "click",
      spinWheel
    );

  </script>

</body>
