<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Alex Loves Mariam</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      text-align: center;
      overflow-x: hidden;

      /*
        PINK BACKGROUND
      */
      background:
        radial-gradient(
          circle at center,
          #ff9fbe 0%,
          #f86f9b 35%,
          #e83f73 70%,
          #c91f58 100%
        );
    }


    /* =========================================================
       REPEATING ROMANTIC BACKGROUND
       ========================================================= */

    body::before {
      content:
        "Alex and Mariam Sitting in a Tree     Alex × Mariam     Alex ♥ Mariam     Alex and Mariam Sitting in a Tree     Alex × Mariam     Alex ♥ Mariam     Alex and Mariam Sitting in a Tree     Alex × Mariam     Alex ♥ Mariam     Alex and Mariam Sitting in a Tree     Alex × Mariam     Alex ♥ Mariam     Alex and Mariam Sitting in a Tree     Alex × Mariam     Alex ♥ Mariam";

      position: fixed;

      top: -25%;
      left: -25%;

      width: 150%;
      height: 150%;

      z-index: -2;

      font-size: 34px;
      font-weight: 900;

      line-height: 3.4;

      letter-spacing: 3px;

      color: rgba(255, 255, 255, 0.16);

      transform: rotate(-14deg);

      white-space: pre-wrap;

      pointer-events: none;
    }


    /*
      SECOND LAYER OF BACKGROUND WRITING
    */

    body::after {
      content:
        "ALEX ♥ MARIAM     ALEX ♥ MARIAM     ALEX ♥ MARIAM     ALEX ♥ MARIAM     ALEX ♥ MARIAM     ALEX ♥ MARIAM     ALEX ♥ MARIAM     ALEX ♥ MARIAM     ALEX ♥ MARIAM";

      position: fixed;

      top: -20%;
      left: -20%;

      width: 140%;
      height: 140%;

      z-index: -1;

      font-size: 22px;
      font-weight: bold;

      line-height: 5;

      letter-spacing: 7px;

      color: rgba(139, 0, 45, 0.13);

      transform: rotate(12deg);

      white-space: pre-wrap;

      pointer-events: none;
    }


    /* =========================================================
       MAIN
       ========================================================= */

    main {
      min-height: 100vh;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      padding: 35px 20px 55px;

      position: relative;
    }


    /* =========================================================
       TITLE
       ========================================================= */

    h1 {
      margin: 0;

      font-size: clamp(38px, 6vw, 68px);

      font-weight: 900;

      letter-spacing: 2px;

      color: white;

      text-shadow:
        0 4px 0 #b8174d,
        0 7px 18px rgba(103, 0, 38, 0.4);
    }


    .subtitle {
      margin-top: 8px;
      margin-bottom: 30px;

      font-size: clamp(19px, 3vw, 28px);

      font-weight: 900;

      color: #fff4b8;

      text-shadow:
        0 3px 8px rgba(107, 0, 38, 0.5);
    }


    /* =========================================================
       WHEEL AREA
       ========================================================= */

    .wheel-wrapper {
      position: relative;

      width: min(780px, 94vw);

      aspect-ratio: 1 / 1;

      display: flex;

      align-items: center;
      justify-content: center;

      /*
        Large dramatic shadow
      */

      filter:
        drop-shadow(
          0 25px 35px rgba(111, 0, 45, 0.45)
        );
    }


    /* =========================================================
       GOLD OUTER RING
       ========================================================= */

    .wheel-wrapper::before {
      content: "";

      position: absolute;

      width: 99%;
      height: 99%;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          #fff1a8,
          #d4a72c,
          #fff5b7,
          #b98217,
          #ffe88a,
          #c69424
        );

      z-index: 0;

      box-shadow:
        0 0 0 5px rgba(255, 255, 255, 0.75),
        0 0 25px rgba(255, 215, 80, 0.8);
    }


    canvas {
      position: relative;

      z-index: 1;

      width: 95%;
      height: 95%;

      display: block;

      border-radius: 50%;

      transition:
        transform 8s cubic-bezier(0.12, 0.75, 0.15, 1);
    }


    /* =========================================================
       HEARTS AROUND OUTSIDE
       ========================================================= */

    .heart {
      position: absolute;

      z-index: 4;

      font-size: 34px;

      color: #fff0a6;

      text-shadow:
        0 2px 5px rgba(95, 0, 30, 0.55),
        0 0 8px rgba(255, 220, 80, 0.7);

      pointer-events: none;
    }


    .heart1 {
      top: 5%;
      left: 13%;
      transform: rotate(-20deg);
    }

    .heart2 {
      top: 4%;
      right: 14%;
      transform: rotate(20deg);
    }

    .heart3 {
      top: 42%;
      left: -1%;
      transform: rotate(-15deg);
    }

    .heart4 {
      top: 42%;
      right: -1%;
      transform: rotate(15deg);
    }

    .heart5 {
      bottom: 7%;
      left: 13%;
      transform: rotate(20deg);
    }

    .heart6 {
      bottom: 7%;
      right: 13%;
      transform: rotate(-20deg);
    }


    /* =========================================================
       POINTER
       ========================================================= */

    .pointer {
      position: absolute;

      top: -7px;

      left: 50%;

      transform: translateX(-50%);

      width: 0;
      height: 0;

      border-left: 31px solid transparent;
      border-right: 31px solid transparent;

      border-top: 68px solid #ffd84d;

      z-index: 10;

      filter:
        drop-shadow(
          0 5px 5px rgba(86, 0, 25, 0.55)
        );
    }


    /*
      White/gold pointer tip
    */

    .pointer::after {
      content: "";

      position: absolute;

      top: -65px;
      left: -7px;

      width: 14px;
      height: 14px;

      border-radius: 50%;

      background: white;

      box-shadow:
        0 0 10px #fff6a8;
    }


    /* =========================================================
       SPIN BUTTON
       ========================================================= */

    button {
      margin-top: 40px;

      padding: 18px 58px;

      font-size: 27px;

      font-weight: 900;

      border: 4px solid #ffe78a;

      border-radius: 999px;

      cursor: pointer;

      color: #7d1238;

      background:
        linear-gradient(
          180deg,
          #fff4a9 0%,
          #ffd84d 45%,
          #e9ad20 100%
        );

      box-shadow:
        0 8px 0 #a86d12,
        0 14px 25px rgba(102, 0, 35, 0.4);

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
    }


    button:hover:not(:disabled) {
      transform:
        translateY(-3px)
        scale(1.04);

      box-shadow:
        0 11px 0 #a86d12,
        0 18px 30px rgba(102, 0, 35, 0.45);
    }


    button:active:not(:disabled) {
      transform:
        translateY(5px)
        scale(0.98);

      box-shadow:
        0 3px 0 #a86d12,
        0 8px 15px rgba(102, 0, 35, 0.35);
    }


    button:disabled {
      opacity: 0.65;

      cursor: not-allowed;
    }


    /* =========================================================
       RESULT
       ========================================================= */

    #result {
      margin-top: 30px;

      padding: 14px 28px;

      max-width: 900px;

      min-height: 50px;

      font-size: clamp(22px, 3vw, 34px);

      line-height: 1.3;

      font-weight: 900;

      color: white;

      text-shadow:
        0 4px 10px rgba(108, 0, 35, 0.6);
    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 600px) {

      main {
        padding-top: 25px;
      }

      .subtitle {
        margin-bottom: 18px;
      }

      .wheel-wrapper {
        width: 97vw;
      }

      .heart {
        font-size: 24px;
      }

      .pointer {
        border-left-width: 23px;
        border-right-width: 23px;
        border-top-width: 52px;
      }

      button {
        margin-top: 28px;

        padding: 15px 44px;

        font-size: 22px;
      }

      #result {
        font-size: 22px;
      }
    }
  </style>
</head>


<body>

  <main>

    <h1>Alex &amp; Mariam</h1>

    <div class="subtitle">
      Alex and Mariam Sitting in a Tree ❤️
    </div>


    <div class="wheel-wrapper">

      <!-- Hearts around the wheel -->

      <div class="heart heart1">♥</div>
      <div class="heart heart2">♥</div>
      <div class="heart heart3">♥</div>
      <div class="heart heart4">♥</div>
      <div class="heart heart5">♥</div>
      <div class="heart heart6">♥</div>


      <!-- Pointer -->

      <div class="pointer"></div>


      <!-- Wheel -->

      <canvas
        id="wheel"
        width="900"
        height="900">
      </canvas>

    </div>


    <button id="spinBtn">
      SPIN ❤️
    </button>


    <div id="result">
      Click spin to begin
    </div>

  </main>


  <script>

    /* =========================================================
       PRIZES
       ========================================================= */

    const items = [

      "Screen Time Tribute",

      "Movie or TV Marathon",

      "Favourite Food Delivery",

      "Premium Scratches Session",

      "Short Story of Our Love Story - New Theme Each Time",

      "TV Show Edit",

      "No-Complaints Errand Run",

      "Apology Letter",

      "Spa Night at Air B&B",

      "Snack Basket Offering",

      "Pop Playlist for Us",

      "Memory Lane Slideshow",

      "Next Car Maintenance",

      "Cozy Blanket Fort Night",

      "Handmade Coupon of Her Choice",

      "Plan the Next Cute Outing",

      "Other of Your Choosing",

      "New Innovative Idea",

      "Full Day Princess Treatment",

      "Cook Egyptian Meal of Your Choosing with Tea",

      "Find New TV Show for Us",

      "Drives To and From Work for a Week",

      "Drive Home, Even from Toronto, at Any Time of Your Choosing",

      "Buy New Article of Clothing of Your Choosing",

      "Buy New Perfume of Your Choosing"

    ];


    /* =========================================================
       SETUP
       ========================================================= */

    const canvas =
      document.getElementById("wheel");

    const ctx =
      canvas.getContext("2d");

    const spinBtn =
      document.getElementById("spinBtn");

    const result =
      document.getElementById("result");


    const size =
      canvas.width;

    const center =
      size / 2;

    const radius =
      center - 22;


    const sliceAngle =
      (2 * Math.PI) /
      items.length;


    let currentRotation = 0;

    let spinning = false;


    /* =========================================================
       TEXT WRAPPING
       ========================================================= */

    function drawWrappedText(
      text,
      x,
      y,
      maxWidth,
      lineHeight
    ) {

      const words =
        text.split(" ");

      const lines = [];

      let currentLine = "";


      for (const word of words) {

        const testLine =
          currentLine
            ? currentLine + " " + word
            : word;


        const width =
          ctx.measureText(testLine).width;


        if (
          width > maxWidth &&
          currentLine
        ) {

          lines.push(
            currentLine
          );

          currentLine =
            word;

        } else {

          currentLine =
            testLine;

        }

      }


      if (currentLine) {
        lines.push(currentLine);
      }


      const totalHeight =
        lines.length *
        lineHeight;


      lines.forEach(
        (line, index) => {

          ctx.fillText(
            line,
            x,
            y -
              totalHeight / 2 +
              index *
                lineHeight +
              lineHeight / 2
          );

        }
      );

    }


    /* =========================================================
       DRAW WHEEL
       ========================================================= */

    function drawWheel() {

      ctx.clearRect(
        0,
        0,
        size,
        size
      );


      /*
        Romantic game-show colours
      */

      const colours = [

        "#ff4f87",
        "#9b3fc4",
        "#e83d6f",
        "#7136a8",
        "#ff6b9d",
        "#b23cc7"

      ];


      for (
        let i = 0;
        i < items.length;
        i++
      ) {

        const startAngle =
          i * sliceAngle;

        const endAngle =
          startAngle +
          sliceAngle;


        /* -----------------------------------------
           SLICE
        ----------------------------------------- */

        ctx.beginPath();

        ctx.moveTo(
          center,
          center
        );

        ctx.arc(
          center,
          center,
          radius,
          startAngle,
          endAngle
        );

        ctx.closePath();


        ctx.fillStyle =
          colours[
            i % colours.length
          ];

        ctx.fill();


        /*
          GOLD DIVIDER
        */

        ctx.strokeStyle =
          "#ffe27a";

        ctx.lineWidth = 5;

        ctx.stroke();


        /* -----------------------------------------
           TEXT
        ----------------------------------------- */

        ctx.save();


        ctx.translate(
          center,
          center
        );


        const textAngle =
          startAngle +
          sliceAngle / 2;


        ctx.rotate(
          textAngle
        );


        ctx.textAlign =
          "right";

        ctx.textBaseline =
          "middle";


        /*
          Large readable text
        */

        ctx.font =
          "900 19px Arial";


        /*
          Text shadow
        */

        ctx.shadowColor =
          "rgba(70,0,30,0.55)";

        ctx.shadowBlur = 4;

        ctx.shadowOffsetX = 2;
        ctx.shadowOffsetY = 2;


        ctx.fillStyle =
          "#ffffff";


        drawWrappedText(
          items[i],
          center - 48,
          0,
          285,
          21
        );


        ctx.restore();

      }


      /* =====================================================
         OUTER GOLD RING
      ===================================================== */

      ctx.beginPath();

      ctx.arc(
        center,
        center,
        radius,
        0,
        Math.PI * 2
      );

      ctx.strokeStyle =
        "#fff0a3";

      ctx.lineWidth = 12;

      ctx.stroke();


      /* =====================================================
         INNER GOLD RING
      ===================================================== */

      ctx.beginPath();

      ctx.arc(
        center,
        center,
        75,
        0,
        Math.PI * 2
      );

      ctx.fillStyle =
        "#8c1746";

      ctx.fill();


      ctx.strokeStyle =
        "#ffe27a";

      ctx.lineWidth = 7;

      ctx.stroke();


      /* =====================================================
         CENTRE HEART
      ===================================================== */

      ctx.shadowColor =
        "rgba(0,0,0,0.35)";

      ctx.shadowBlur = 8;


      ctx.fillStyle =
        "#ffffff";

      ctx.font =
        "900 43px Arial";

      ctx.textAlign =
        "center";

      ctx.textBaseline =
        "middle";


      ctx.fillText(
        "♥",
        center,
        center
      );


      ctx.shadowColor =
        "transparent";

    }


    /* =========================================================
       SPIN
       ========================================================= */

    function spinWheel() {

      if (spinning) {
        return;
      }


      spinning = true;

      spinBtn.disabled =
        true;


      result.textContent =
        "Spinning... ❤️";


      /* -----------------------------------------
         PICK WINNER
      ----------------------------------------- */

      const randomIndex =
        Math.floor(
          Math.random() *
          items.length
        );


      const degreesPerSlice =
        360 /
        items.length;


      /* -----------------------------------------
         LAND WINNER UNDER POINTER
      ----------------------------------------- */

      const winningAngle =
        270 -
        randomIndex *
          degreesPerSlice -
        degreesPerSlice / 2;


      /*
        BIG GAME-SHOW SPIN
      */

      const extraSpins =
        12 * 360;


      const finalRotation =
        currentRotation +
        extraSpins +
        winningAngle;


      canvas.style.transform =
        `rotate(${finalRotation}deg)`;


      currentRotation =
        finalRotation % 360;


      /* -----------------------------------------
         SHOW RESULT
      ----------------------------------------- */

      setTimeout(() => {

        result.textContent =
          `❤️ ${items[randomIndex]} ❤️`;


        spinBtn.disabled =
          false;


        spinning =
          false;

      }, 8000);

    }


    /* =========================================================
       INITIALIZE
       ========================================================= */

    drawWheel();


    spinBtn.addEventListener(
      "click",
      spinWheel
    );

  </script>

</body>
</html>
