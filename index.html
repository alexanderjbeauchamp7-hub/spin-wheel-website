<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">

    href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@700;800;900&display=swap"

  <style>

    /* =========================================================
       BASIC PAGE SETUP
       ========================================================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;

      font-family: "Inter", Arial, Helvetica, sans-serif;

      color: white;

      background:
        radial-gradient(
          circle at 50% 42%,
          #35101f 0%,
          #1b0912 40%,
          #0c060a 75%,
          #050305 100%
        );
    }


    /* =========================================================
       ROMANTIC BACKGROUND
       ========================================================= */

    .love-background {
      position: fixed;
      inset: 0;

      overflow: hidden;

      z-index: 0;

      pointer-events: none;
    }


    .love-line {
      position: absolute;

      font-family: "Caveat", cursive;
      font-weight: 700;

      color: #ff638e;

      white-space: nowrap;

      text-shadow:
        0 0 4px rgba(255, 50, 110, 0.7),
        0 0 13px rgba(255, 25, 95, 0.28);

      opacity: 0.95;
    }


    .love-line.big {
      font-size: clamp(30px, 3.2vw, 52px);
    }


    .love-line.small {
      font-size: clamp(25px, 2.6vw, 42px);
    }


    .heart-bg {
      position: absolute;

      color: #ff3f76;

      font-size: clamp(27px, 3vw, 48px);

      font-family: Arial, sans-serif;

      text-shadow:
        0 0 5px #ff2d68,
        0 0 13px rgba(255, 45, 104, 0.45);

      opacity: 0.95;
    }


    /* =========================================================
       MAIN
       ========================================================= */

    main {
      position: relative;

      z-index: 2;

      min-height: 100vh;

      display: flex;
      flex-direction: column;

      align-items: center;

      padding: 45px 20px 50px;
    }


    /* =========================================================
       WHEEL
       ========================================================= */

    .wheel-wrapper {
      position: relative;

      width: min(900px, 82vw);

      aspect-ratio: 1 / 1;

      display: flex;

      align-items: center;
      justify-content: center;

      margin-top: 15px;

      filter:
        drop-shadow(
          0 22px 32px rgba(0, 0, 0, 0.8)
        );
    }


    /* =========================================================
       NEON OUTER RING
       ========================================================= */

    .wheel-wrapper::before {
      content: "";

      position: absolute;

      inset: -13px;

      border-radius: 50%;

      border: 5px solid #ff3f83;

      box-shadow:
        0 0 4px white,
        0 0 10px #ff78a8,
        0 0 20px #ff1768,
        0 0 38px rgba(255, 23, 103, 0.7);

      z-index: 0;
    }


    .wheel-wrapper::after {
      content: "";

      position: absolute;

      inset: -2px;

      border-radius: 50%;

      border: 5px solid #130811;

      z-index: 1;

      pointer-events: none;
    }


    canvas {
      position: relative;

      z-index: 2;

      width: 100%;
      height: 100%;

      display: block;

      border-radius: 50%;

      transition:
        transform 8s cubic-bezier(
          0.12,
          0.73,
          0.12,
          1
        );
    }


    /* =========================================================
       GAME SHOW LIGHT BULBS
       ========================================================= */

    .bulbs {
      position: absolute;

      inset: -3px;

      border-radius: 50%;

      z-index: 5;

      pointer-events: none;
    }


    .bulb {
      position: absolute;

      width: 12px;
      height: 12px;

      background: white;

      border-radius: 50%;

      box-shadow:
        0 0 5px white,
        0 0 10px #ff9fc1,
        0 0 15px #ff3f83;

      left: 50%;
      top: 50%;

      margin-left: -6px;
      margin-top: -6px;
    }


    /* =========================================================
       GOLD POINTER
       ========================================================= */

    .pointer {
      position: absolute;

      top: -38px;
      left: 50%;

      transform: translateX(-50%);

      width: 92px;
      height: 82px;

      z-index: 20;

      clip-path:
        polygon(
          0 0,
          100% 0,
          50% 100%
        );

      background:
        linear-gradient(
          135deg,
          #fff9a7 0%,
          #ffe353 28%,
          #ffc72f 55%,
          #f1a918 75%,
          #ffe96d 100%
        );

      filter:
        drop-shadow(0 0 5px #ffb829)
        drop-shadow(
          0 5px 5px rgba(0,0,0,0.75)
        );
    }


    /* =========================================================
       CENTER SPIN BUTTON
       ========================================================= */

    .center-spin {
      position: absolute;

      width: 220px;
      height: 220px;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      border-radius: 50%;

      z-index: 10;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      cursor: pointer;

      background:
        radial-gradient(
          circle at 45% 38%,
          #2d1424 0%,
          #160b14 50%,
          #09060a 100%
        );

      border:
        5px solid #ff3f83;

      box-shadow:
        0 0 0 3px #671230,
        inset 0 0 18px rgba(255, 56, 132, 0.28),
        0 0 8px #ff4a8b,
        0 0 18px rgba(255, 30, 110, 0.7);

      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease;
    }


    .center-spin:hover {
      transform:
        translate(-50%, -50%)
        scale(1.04);

      box-shadow:
        0 0 0 3px #8d1743,
        inset 0 0 25px rgba(255, 56, 132, 0.4),
        0 0 10px #ff4a8b,
        0 0 30px rgba(255, 30, 110, 0.85);
    }


    .center-spin.disabled {
      pointer-events: none;
    }


    .spin-word {
      font-size: 55px;

      line-height: 1;

      font-weight: 900;

      color: white;

      text-shadow:
        0 0 4px white,
        0 0 12px #ff62a1,
        0 0 22px rgba(255, 49, 131, 0.8);
    }


    .center-heart {
      margin-top: 8px;

      font-size: 38px;

      color: #ff9dcc;

      text-shadow:
        0 0 10px #ff4d9a;
    }


    /* =========================================================
       BOTTOM SPIN BUTTON
       ========================================================= */

    #spinBtn {
      position: relative;

      z-index: 5;

      margin-top: 32px;

      width: min(350px, 80vw);

      padding: 17px 25px;

      border-radius: 28px;

      border:
        3px solid #ff78a9;

      cursor: pointer;

      font-family:
        "Inter",
        sans-serif;

      font-size: 31px;

      font-weight: 900;

      color: white;

      background:
        linear-gradient(
          180deg,
          #ff3f7f,
          #ef1460
        );

      box-shadow:
        inset 0 1px 8px rgba(255,255,255,0.4),
        0 0 7px #ff5593,
        0 0 22px rgba(255, 34, 112, 0.7),
        0 7px 15px rgba(0,0,0,0.45);

      text-shadow:
        0 2px 3px rgba(0,0,0,0.25);

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
    }


    #spinBtn:hover:not(:disabled) {
      transform:
        translateY(-2px)
        scale(1.025);

      box-shadow:
        inset 0 1px 8px rgba(255,255,255,0.4),
        0 0 10px #ff5593,
        0 0 32px rgba(255, 34, 112, 0.9),
        0 10px 18px rgba(0,0,0,0.45);
    }


    #spinBtn:active:not(:disabled) {
      transform:
        translateY(2px)
        scale(0.98);
    }


    #spinBtn:disabled {
      opacity: 0.65;

      cursor: not-allowed;
    }


    /* =========================================================
       RESULT
       ========================================================= */

    #result {
      position: relative;

      z-index: 5;

      margin-top: 15px;

      width: min(460px, 90vw);

      min-height: 72px;

      padding: 20px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 28px;

      border:
        2px solid #6c5363;

      background:
        rgba(12, 7, 12, 0.94);

      font-size: 20px;

      font-weight: 800;

      text-align: center;

      color: #ff66ad;

      box-shadow:
        0 8px 22px rgba(0,0,0,0.45);
    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 700px) {

      main {
        padding:
          35px 7px
          40px;
      }

      .wheel-wrapper {
        width: 94vw;

        margin-top: 25px;
      }

      .center-spin {
        width: 25%;
        height: 25%;
      }

      .spin-word {
        font-size:
          clamp(
            23px,
            7vw,
            43px
          );
      }

      .center-heart {
        font-size: 24px;
      }

      .pointer {
        width: 62px;
        height: 57px;

        top: -25px;
      }

      .bulb {
        width: 8px;
        height: 8px;

        margin-left: -4px;
        margin-top: -4px;
      }

      #spinBtn {
        margin-top: 27px;

        font-size: 25px;
      }

      .love-line.big {
        font-size: 28px;
      }

      .love-line.small {
        font-size: 23px;
      }

    }

  </style>
</head>

  <script>

    /* =========================================================

    const prizes = [

      },

      {

        lines: [
          "Find New",

        font: 25
      },

      {
        text: "Drives To and From Work for a Week",
        lines: [

        ],
        font: 22
      },

      {
        text: "Drive Home, Even from Toronto, at Any Time of Your Choosing",
        lines: [
          "Drive Home",
          "Even from Toronto",
          "Any Time of",
          "Your Choosing"
        ],
        font: 19
      },

      {

        lines: [
          "Buy New Article",
          "of Clothing",

        ],
        font: 21
      },

      {
        text: "Buy New Perfume of Your Choosing",
        lines: [
          "Buy New Perfume",
          "of Your",
          "Choosing"
        ],
        font: 22
      }

    ];


    /* =========================================================
       SETUP
       ========================================================= */

    const canvas =
      document.getElementById("wheel");

    const ctx =
      canvas.getContext("2d");

    const spinBtn =
      document.getElementById("spinBtn");

    const centerSpin =
      document.getElementById("centerSpin");

    const result =
      document.getElementById("result");

    const bulbs =
      document.getElementById("bulbs");

    const background =
      document.getElementById(
        "loveBackground"
      );


    const size =
      canvas.width;

    const center =
      size / 2;

    const radius =
      center - 20;

    /*
     * Larger center circle leaves
     * a clean area around SPIN.
     */

    const innerRadius =
      170;


    const sliceAngle =
      (
        Math.PI * 2
      ) /
      prizes.length;


    let currentRotation = 0;

    let spinning = false;


    /* =========================================================
       BACKGROUND TEXT
       ========================================================= */

    const backgroundPhrases = [

      "Alex and Mariam<br>Sitting in a Tree",

      "Alex × Mariam"

    ];


    const positions = [

      [0,1,-7],
      [22,3,-5],
      [65,1,5],
      [86,3,4],

      [3,16,-7],
      [24,17,-5],

      [2,82,-7],

      [88,83,4],

      [2,94,-5],
      [26,94,-4],
      [68,94,5],
      [87,94,4]

    ];


    positions.forEach(
      (position, index) => {

        const phrase =
          document.createElement("div");


        phrase.className =
          "love-line " +
          (
            index % 3 === 0
              ? "big"

          );

        phrase.style.left =

        );

      }
    );


    /* =========================================================
       BACKGROUND HEARTS
       ========================================================= */

    const heartPositions = [

      [17,2],
      [39,3],
      [45,7],
      [57,2],
      [76,5],
      [96,3],

      [8,10],
      [34,12],
      [61,10],
      [73,13],
      [92,12],

      [4,22],
      [17,24],
      [39,21],
      [82,21],
      [97,24],

      [8,37],
      [19,36],
      [78,36],
      [92,38],

      [3,53],
      [17,52],
      [82,51],
      [97,54],

      [8,69],
      [21,69],
      [76,68],
      [92,70],

      [3,85],
      [16,83],
      [39,86],
      [62,84],
      [81,86],
      [97,83],

      [8,96],
      [35,95],
      [71,96],
      [91,95]

    ];


    heartPositions.forEach(
      (position, index) => {

        const heart =
          document.createElement("div");


        heart.className =
          "heart-bg";


        heart.textContent =
          index % 3 === 0
            ? "♡"
            : "♥";


        heart.style.left =
          position[0] + "%";

        heart.style.top =
          position[1] + "%";


        heart.style.transform =
          `rotate(${(index % 5 - 2) * 9}deg)`;


        background.appendChild(
          heart
        );

      }
    );


    /* =========================================================
       LIGHT BULBS
       ========================================================= */

    const bulbCount = 24;


    for (
      let i = 0;
      i < bulbCount;
      i++
    ) {

      const bulb =
        document.createElement("div");


      bulb.className =
        "bulb";


      const angle =
        (
          i /
          bulbCount
        ) *
        Math.PI *
        2;


      const bulbRadius =
        49.6;


      const x =
        50 +
        Math.cos(angle) *
        bulbRadius;


      const y =
        50 +
        Math.sin(angle) *
        bulbRadius;


      bulb.style.left =
        x + "%";


      bulb.style.top =
        y + "%";


      bulbs.appendChild(
        bulb
      );

    }


    /* =========================================================
       WHEEL COLORS
       ========================================================= */

    const colours = [

      "#f6bdd0",
      "#ff315b",
      "#a58bf4"

    ];


    /* =========================================================
       DRAW WHEEL
       ========================================================= */

    function drawWheel() {

      ctx.clearRect(
        0,
        0,
        size,
        size
      );


      for (
        let i = 0;
        i < prizes.length;
        i++
      ) {

        const prize =
          prizes[i];


        const startAngle =
          -Math.PI / 2 +
          i * sliceAngle;


        const endAngle =
          startAngle +
          sliceAngle;


        const middleAngle =
          startAngle +
          sliceAngle / 2;


        /* =====================================================
           DRAW SLICE
           ===================================================== */

        ctx.beginPath();


        ctx.moveTo(
          center,
          center
        );


        ctx.arc(
          center,
          center,
          radius,
          startAngle,
          endAngle
        );


        ctx.closePath();


        ctx.fillStyle =
          colours[
            i %
            colours.length
          ];


        ctx.fill();


        /*
         * Dark slice dividers.
         */

        ctx.strokeStyle =
          "#160a12";


        ctx.lineWidth = 4;


        ctx.stroke();


        /* =====================================================
           DRAW LABEL
           ===================================================== */

        ctx.save();


        ctx.translate(
          center,
          center
        );


        /*
         * Point directly down the middle
         * of this slice.
         */

        ctx.rotate(
          middleAngle
        );


        /*
         * We position the wording farther toward
         * the OUTSIDE of the wheel.

         * This gives every label more room and
         * prevents it touching the SPIN circle.
         */

        const textRadius =
          innerRadius +
          (
            radius -
            innerRadius
          ) *
          0.56;


        /*
         * Rotate the lettering so the text runs
         * ALONG the slice rather than across
         * neighbouring slices.
         */

        ctx.translate(
          textRadius,
          0
        );


        ctx.rotate(
          Math.PI / 2
        );


        /*
         * Determine whether this slice is
         * on the bottom half.

         * If so, flip the wording 180 degrees
         * so it remains readable.
         */

        const normalizedAngle =
          (
            middleAngle +
            Math.PI * 2
          ) %
          (
            Math.PI * 2
          );


        if (
          normalizedAngle >
            0 &&
          normalizedAngle <
            Math.PI
        ) {

          /*
           * Right/bottom half.
           */

        } else {

          ctx.rotate(
            Math.PI
          );

        }


        /* =====================================================
           TEXT STYLE
           ===================================================== */

        ctx.font =
          `900 ${prize.font}px Inter, Arial`;


        ctx.textAlign =
          "center";


        ctx.textBaseline =
          "middle";


        /*
         * Red slices use white lettering.
         * Pink/lavender use dark lettering.
         */

        if (
          i %
          colours.length === 1
        ) {

          ctx.fillStyle =
            "#ffffff";


          ctx.shadowColor =
            "rgba(80,0,20,0.28)";

        } else {

          ctx.fillStyle =
            "#120a10";


          ctx.shadowColor =
            "rgba(255,255,255,0.16)";

        }


        ctx.shadowBlur = 2;


        /* =====================================================
           EXACT CUSTOM LINE BREAKS
           ===================================================== */

        /*
         * Since every prize has its own lines,
         * there is NO automatic wrapping.

         * This is what stops text from suddenly
         * expanding into another wedge.
         */

        const lineHeight =
          prize.font + 3;


        const totalHeight =
          (
            prize.lines.length - 1
          ) *
          lineHeight;


        prize.lines.forEach(
          (line, lineIndex) => {

            ctx.fillText(
              line,
              0,
              lineIndex *
                lineHeight -
                totalHeight / 2
            );

          }
        );


        ctx.restore();

      }


      /* =====================================================
         OUTER BORDER
         ===================================================== */

      ctx.beginPath();


      ctx.arc(
        center,
        center,
        radius - 2,
        0,
        Math.PI * 2
      );


      ctx.strokeStyle =
        "#170911";


      ctx.lineWidth = 12;


      ctx.stroke();


      /* =====================================================
         CENTER CIRCLE
         ===================================================== */

      ctx.beginPath();


      ctx.arc(
        center,
        center,
        innerRadius,
        0,
        Math.PI * 2
      );


      ctx.fillStyle =
        "#130912";


      ctx.fill();


      ctx.strokeStyle =
        "#ff3e83";


      ctx.lineWidth = 9;


      ctx.stroke();

    }


    /* =========================================================
       SPIN FUNCTION
       ========================================================= */

    function spinWheel() {

      if (spinning) {
        return;
      }


      spinning = true;


      spinBtn.disabled =
        true;


      centerSpin.classList.add(
        "disabled"
      );


      result.textContent =
        "Spinning... ♥";


      /* =====================================================
         RANDOM WINNER
         ===================================================== */

      const randomIndex =
        Math.floor(
          Math.random() *
          prizes.length
        );


      const degreesPerSlice =
        360 /
        prizes.length;


      /*
       * Desired rotation so the CENTER
       * of the selected slice lands directly
       * underneath the pointer.
       */

      const target =
        -(
          randomIndex *
            degreesPerSlice +
          degreesPerSlice / 2
        );


      const currentNormalized =
        (
          (
            currentRotation %
            360
          ) +
          360
        ) %
        360;


      let difference =
        target -
        currentNormalized;


      difference =
        (
          (
            difference %
            360
          ) +
          360
        ) %
        360;


      /*
       * Ten complete rotations before
       * landing on the selected prize.
       */

      const extraSpins =
        10 * 360;


      const finalRotation =
        currentRotation +
        extraSpins +
        difference;


      canvas.style.transform =
        `rotate(${finalRotation}deg)`;


      currentRotation =
        finalRotation;


      /* =====================================================
         SHOW WINNER
         ===================================================== */

      setTimeout(
        () => {

          result.innerHTML =
            `♥&nbsp;&nbsp;${prizes[randomIndex].text}&nbsp;&nbsp;♥`;


          spinBtn.disabled =
            false;


          centerSpin.classList.remove(
            "disabled"
          );


          spinning =
            false;

        },
        8000
      );

    }


    /* =========================================================
       INITIALIZE
       ========================================================= */

    drawWheel();


    spinBtn.addEventListener(
      "click",
      spinWheel
    );


    centerSpin.addEventListener(
      "click",
      spinWheel
    );

  </script>

</body>
